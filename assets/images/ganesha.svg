<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8F6218"/>
    </linearGradient>
  </defs>
  <!-- Modern Minimalist Ganesha Line Art -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mukut Crown -->
    <path d="M44 18 L50 10 L56 18 Z" fill="url(#gold)" opacity="0.2"/>
    <path d="M44 18 L50 10 L56 18"/>
    <circle cx="50" cy="8" r="1.5" fill="url(#gold)"/>
    <!-- Tilak -->
    <path d="M48 24 L52 24 M50 20 L50 28" stroke="#D32F2F" stroke-width="2"/>
    <circle cx="50" cy="30" r="1.5" fill="#D32F2F"/>
    <!-- Ears -->
    <path d="M42 26 C28 24 24 38 32 46 C38 52 42 46 44 42"/>
    <path d="M58 26 C72 24 76 38 68 46 C62 52 58 46 56 42"/>
    <!-- Trunk (curving gently left with Modak) -->
    <path d="M48 38 C48 56 42 66 50 72 C56 75 62 70 60 62 C58 56 50 58 50 62"/>
    <!-- Modak -->
    <circle cx="60" cy="62" r="2.5" fill="url(#gold)"/>
    <!-- Tusk -->
    <path d="M43 45 L38 48"/>
    <!-- Base Lotus curve -->
    <path d="M35 84 Q50 90 65 84" stroke-width="1.5"/>
    <path d="M38 88 Q50 94 62 88" stroke-width="1"/>
  </g>
</svg>
