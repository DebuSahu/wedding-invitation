<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="35%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#DD2C00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <style>
      @keyframes flicker {
        0%, 100% { transform: scale(1, 1) rotate(0deg); opacity: 0.95; }
        25% { transform: scale(1.07, 0.94) rotate(-2.5deg); opacity: 1; }
        50% { transform: scale(0.95, 1.06) rotate(1.5deg); opacity: 0.88; }
        75% { transform: scale(1.05, 1.02) rotate(-1.5deg); opacity: 1; }
      }
      @keyframes glowAura {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.25); opacity: 0.85; }
      }
      .flame-group {
        transform-origin: 50px 46px;
        animation: flicker 1.6s infinite ease-in-out;
      }
      .aura-glow {
        transform-origin: 50px 38px;
        animation: glowAura 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Radiant Aura -->
  <circle class="aura-glow" cx="50" cy="38" r="30" fill="url(#flame)"/>

  <!-- Flickering Flame Group -->
  <g class="flame-group">
    <!-- Outer Amber Flame -->
    <path d="M50 18 C44 28 39 37 42 46 C45 52 55 52 58 46 C61 37 56 28 50 18 Z" fill="#FF9100"/>
    <!-- Middle Golden Flame -->
    <path d="M50 23 C46 30 42 37 45 44 C47 48 53 48 55 44 C58 37 54 30 50 23 Z" fill="#FFD54F"/>
    <!-- Inner White-Hot Core -->
    <path d="M50 29 C48 34 46 38 48 42 C49 45 51 45 52 42 C54 38 52 34 50 29 Z" fill="#FFFDE7"/>
  </g>

  <!-- Brass Lamp Bowl -->
  <ellipse cx="50" cy="56" rx="32" ry="8" fill="url(#brass)" stroke="#FFF2B2" stroke-width="1.2"/>
  <path d="M20 56 C20 73 33 82 50 82 C67 82 80 73 80 56 Z" fill="url(#brass)"/>
  <!-- Ornate Carvings on Bowl -->
  <path d="M28 62 Q50 72 72 62" stroke="#FFF0A0" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M34 68 Q50 76 66 68" stroke="#FFF0A0" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Pedestal Base -->
  <path d="M42 82 L36 90 L64 90 L58 82 Z" fill="url(#brass)"/>
  <ellipse cx="50" cy="90" rx="18" ry="3.5" fill="#D4AF37"/>
</svg>
