<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="peaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ACC1" />
      <stop offset="40%" stop-color="#00838F" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>
    <linearGradient id="peaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Peacock Tail / Feather Crest Fan -->
    <!-- Fan feather 1 -->
    <path d="M70 90 C50 60, 20 50, 15 65 C10 80, 50 95, 70 90 Z" fill="url(#peaGold)" opacity="0.8"/>
    <circle cx="25" cy="62" r="6" fill="#00838F"/>
    <circle cx="25" cy="62" r="3" fill="#004D40"/>

    <!-- Fan feather 2 -->
    <path d="M70 90 C45 40, 30 20, 45 15 C60 10, 70 60, 70 90 Z" fill="url(#peaGold)" opacity="0.85"/>
    <circle cx="43" cy="25" r="6" fill="#00838F"/>
    <circle cx="43" cy="25" r="3" fill="#004D40"/>

    <!-- Fan feather 3 (Tall) -->
    <path d="M70 90 C65 30, 68 5, 82 5 C96 5, 88 50, 70 90 Z" fill="url(#peaGold)" opacity="0.9"/>
    <circle cx="80" cy="15" r="6" fill="#00838F"/>
    <circle cx="80" cy="15" r="3" fill="#004D40"/>

    <!-- Fan feather 4 -->
    <path d="M70 90 C85 45, 110 20, 120 30 C130 40, 95 70, 70 90 Z" fill="url(#peaGold)" opacity="0.85"/>
    <circle cx="112" cy="35" r="6" fill="#00838F"/>
    <circle cx="112" cy="35" r="3" fill="#004D40"/>

    <!-- Fan feather 5 -->
    <path d="M70 90 C100 65, 130 65, 130 80 C130 95, 90 95, 70 90 Z" fill="url(#peaGold)" opacity="0.8"/>
    <circle cx="120" cy="78" r="6" fill="#00838F"/>
    <circle cx="120" cy="78" r="3" fill="#004D40"/>

    <!-- Peacock Neck & Body -->
    <path d="M68 95 C55 95, 52 115, 65 125 C80 135, 100 120, 95 102 C90 90, 85 82, 85 70 C85 58, 92 50, 88 45 C84 40, 76 42, 74 48 C72 55, 78 68, 76 80 C74 88, 68 92, 68 95 Z" fill="url(#peaBody)" stroke="url(#peaGold)" stroke-width="1.5"/>

    <!-- Beak -->
    <path d="M74 46 L64 48 L73 51 Z" fill="#FBC02D"/>

    <!-- Crown Crest (Kalgi) -->
    <path d="M84 42 L88 32 M86 42 L92 34 M88 43 L96 37" stroke="url(#peaGold)" stroke-width="1.2"/>
    <circle cx="88" cy="32" r="1.5" fill="#00E5FF"/>
    <circle cx="92" cy="34" r="1.5" fill="#00E5FF"/>
    <circle cx="96" cy="37" r="1.5" fill="#00E5FF"/>

    <!-- Eye -->
    <circle cx="80" cy="46" r="1.5" fill="#FFF"/>
    <circle cx="80" cy="46" r="0.8" fill="#000"/>

    <!-- Golden Wing details -->
    <path d="M68 105 Q85 105 88 120" stroke="url(#peaGold)" stroke-width="1.5" fill="none"/>
    <path d="M72 112 Q88 112 85 124" stroke="url(#peaGold)" stroke-width="1.2" fill="none"/>
  </g>
</svg>
