<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <linearGradient id="eleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFCA28" />
      <stop offset="80%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="blanketRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="70%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#7F0000" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Royal Ambari / Howdah (Canopy on Elephant Back) -->
    <path d="M90 40 L130 40 L135 15 L125 10 L95 10 L85 15 Z" fill="url(#eleGold)" stroke="#FFF2B2" stroke-width="1"/>
    <!-- Dome Top -->
    <path d="M100 10 Q110 0 120 10 Z" fill="#FFE082"/>
    <circle cx="110" cy="0" r="2.5" fill="#FFE082"/>
    <!-- Curtains/Pillars of Howdah -->
    <rect x="93" y="20" width="4" height="20" fill="#FFF2B2"/>
    <rect x="123" y="20" width="4" height="20" fill="#FFF2B2"/>
    <rect x="108" y="20" width="4" height="20" fill="#FFF2B2"/>

    <!-- Elephant Silhouette -->
    <!-- Head & Trunk -->
    <path d="M140 65 C160 62, 175 75, 175 90 C175 105, 168 115, 174 130 C178 140, 192 142, 195 132 C197 125, 190 120, 185 125 C180 128, 182 134, 185 135 C180 144, 162 136, 160 120 C158 105, 162 95, 155 88" 
          fill="none" stroke="url(#eleGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Trunk Lotus in Trunk -->
    <path d="M190 120 C194 115, 202 115, 206 120 C202 125, 194 125, 190 120 Z" fill="#E91E63"/>

    <!-- Forehead & Ear -->
    <path d="M130 65 C145 60, 155 70, 150 85 C142 105, 120 110, 115 95 C112 85, 118 70, 130 65 Z" fill="url(#eleGold)"/>
    <path d="M125 72 C135 68, 142 75, 138 85 C132 98, 120 98, 118 90" fill="none" stroke="#FFF2B2" stroke-width="1.2"/>

    <!-- Tusk -->
    <path d="M158 96 Q175 95 182 85 Q172 102 155 102 Z" fill="#FFFFFF"/>

    <!-- Eye -->
    <circle cx="145" cy="74" r="2.5" fill="#3E2723"/>
    <circle cx="146" cy="73" r="0.8" fill="#FFF"/>

    <!-- Forehead Tilak & Ornaments -->
    <path d="M142 60 L146 72 L138 72 Z" fill="#D32F2F"/>
    <circle cx="142" cy="75" r="1.5" fill="#FFF"/>

    <!-- Body -->
    <path d="M70 70 C85 62, 120 60, 135 65 C138 85, 135 110, 135 140 L115 140 L118 115 C108 115, 95 115, 88 115 L82 140 L65 140 C65 110, 60 85, 70 70 Z" fill="url(#eleGold)"/>

    <!-- Hind Legs & Forelegs (Back pair) -->
    <path d="M55 90 C50 110, 52 125, 52 140 L62 140 L65 115" stroke="url(#eleGold)" stroke-width="6" fill="none"/>
    <path d="M135 100 C140 115, 142 125, 142 140 L132 140" stroke="url(#eleGold)" stroke-width="6" fill="none"/>

    <!-- Tail -->
    <path d="M58 85 C50 95, 48 110, 52 125" fill="none" stroke="url(#eleGold)" stroke-width="2.5"/>
    <path d="M52 125 C48 130, 54 135, 50 138" fill="none" stroke="#FFE082" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Royal Jhool (Embroidered Velvet Blanket on Elephant) -->
    <path d="M80 68 L130 68 L126 108 C126 112, 85 112, 84 108 Z" fill="url(#blanketRed)" stroke="#FFF2B2" stroke-width="1.5"/>
    <path d="M88 74 L122 74 L120 102 C120 105, 90 105, 90 102 Z" fill="none" stroke="#FFD54F" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- Golden Lotus in Jhool -->
    <circle cx="105" cy="88" r="6" fill="#FFD54F"/>
    <circle cx="105" cy="88" r="3" fill="#D32F2F"/>
    <!-- Golden Tassels -->
    <path d="M86 110 L86 116 M92 110 L92 116 M98 110 L98 116 M104 110 L104 116 M110 110 L110 116 M116 110 L116 116 M122 110 L122 116" stroke="#FFD54F" stroke-width="2"/>

    <!-- Anklets (Ghungroo) -->
    <rect x="65" y="132" width="17" height="3" fill="#FFD54F"/>
    <rect x="116" y="132" width="19" height="3" fill="#FFD54F"/>
  </g>
</svg>
