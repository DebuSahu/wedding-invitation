<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59A3F" />
      <stop offset="25%" stop-color="#FFEFA6" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="75%" stop-color="#FFEFA6" />
      <stop offset="100%" stop-color="#C59A3F" />
    </linearGradient>
  </defs>

  <!-- Traditional Multi-foil Royal Arch (Cusped Arch) -->
  <path d="M0 0 L600 0 L600 40 
           C520 40, 480 30, 440 45 
           C400 60, 370 75, 340 70 
           C320 65, 310 90, 300 110 
           C290 90, 280 65, 260 70 
           C230 75, 200 60, 160 45 
           C120 30, 80 40, 0 40 Z" fill="url(#archGold)" opacity="0.95"/>

  <!-- Ornate Carved Trim Line -->
  <path d="M0 32 
           C80 32, 120 22, 160 37 
           C200 52, 230 67, 260 62 
           C280 57, 290 82, 300 102 
           C310 82, 320 57, 340 62 
           C370 67, 400 52, 440 37 
           C480 22, 520 32, 600 32" fill="none" stroke="#680816" stroke-width="2"/>

  <!-- Hanging Floral / Pearl Droplets -->
  <g fill="#FFF9C4" stroke="#D4AF37" stroke-width="0.8">
    <circle cx="300" cy="116" r="3.5" />
    <circle cx="260" cy="76" r="2.5" />
    <circle cx="340" cy="76" r="2.5" />
    <circle cx="200" cy="62" r="2.5" />
    <circle cx="400" cy="62" r="2.5" />
    <circle cx="100" cy="42" r="2" />
    <circle cx="500" cy="42" r="2" />
  </g>
</svg>
