<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="instGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="woodDrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>

  <!-- Dholak (Drum) -->
  <g transform="translate(10, 20)">
    <!-- Barrel -->
    <path d="M20 30 C30 15, 80 15, 90 30 C95 50, 95 60, 90 80 C80 95, 30 95, 20 80 C15 60, 15 50, 20 30 Z" fill="url(#woodDrum)" stroke="url(#instGold)" stroke-width="2"/>
    <!-- Left Drum Head -->
    <ellipse cx="20" cy="55" rx="8" ry="25" fill="#EFEBE9" stroke="url(#instGold)" stroke-width="2"/>
    <ellipse cx="20" cy="55" rx="4" ry="12" fill="#4E342E"/>
    <!-- Right Drum Head -->
    <ellipse cx="90" cy="55" rx="8" ry="25" fill="#EFEBE9" stroke="url(#instGold)" stroke-width="2"/>
    <ellipse cx="90" cy="55" rx="4" ry="12" fill="#4E342E"/>
    <!-- Lacings (V-shape ropes) -->
    <path d="M22 35 L55 20 L88 35 M22 45 L55 55 L88 45 M22 55 L55 55 L88 65 M22 75 L55 90 L88 75" stroke="#FFE082" stroke-width="1.2" fill="none"/>
    <!-- Central Ring Strap -->
    <ellipse cx="55" cy="55" rx="4" ry="34" fill="none" stroke="url(#instGold)" stroke-width="2.5"/>
  </g>

  <!-- Shehnai (Auspicious Oboe Pipe) Crossing diagonally -->
  <g transform="translate(40, -10)">
    <!-- Pipe body -->
    <path d="M70 20 L150 95 L145 100 L65 25 Z" fill="url(#woodDrum)" stroke="url(#instGold)" stroke-width="1.2"/>
    <!-- Mouthpiece (Reed) -->
    <path d="M63 23 L55 16 L58 13 L66 20 Z" fill="url(#instGold)"/>
    <!-- Brass Flare Bell -->
    <path d="M145 92 C155 100, 165 110, 172 105 C178 100, 168 85, 152 88 Z" fill="url(#instGold)"/>
    <!-- Bell Rim Oval -->
    <ellipse cx="166" cy="100" rx="9" ry="15" transform="rotate(-40 166 100)" fill="#FFD54F" stroke="#996515" stroke-width="1.5"/>
    <ellipse cx="166" cy="100" rx="6" ry="10" transform="rotate(-40 166 100)" fill="#3E2723"/>
    <!-- Finger Holes -->
    <circle cx="95" cy="48" r="2" fill="#FFF"/>
    <circle cx="107" cy="59" r="2" fill="#FFF"/>
    <circle cx="119" cy="70" r="2" fill="#FFF"/>
    <circle cx="131" cy="81" r="2" fill="#FFF"/>
    <!-- Auspicious Red Ribbon / Tassel on Bell -->
    <path d="M160 105 Q170 120 165 130 M162 106 Q178 118 175 128" stroke="#D32F2F" stroke-width="2.5" fill="none"/>
  </g>
</svg>
