<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRoyale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#F5D77F"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996F19"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Divine Halo Aura -->
  <circle cx="70" cy="70" r="66" fill="url(#auraGlow)"/>
  <circle cx="70" cy="70" r="58" fill="none" stroke="url(#goldRoyale)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Ornate Royal Ganesha -->
  <g fill="none" stroke="url(#goldRoyale)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mukut (Crown) -->
    <path d="M56 34 L70 14 L84 34 Z" fill="url(#goldRoyale)" fill-opacity="0.25"/>
    <path d="M60 28 L70 18 L80 28"/>
    <circle cx="70" cy="11" r="3.5" fill="url(#goldRoyale)"/>
    <path d="M52 35 Q70 30 88 35" stroke-width="2.5"/>

    <!-- Sacred Red Tilak & Trishul -->
    <path d="M66 43 L74 43 M70 37 L70 49" stroke="#E53935" stroke-width="2.8"/>
    <circle cx="70" cy="52" r="2.2" fill="#E53935"/>

    <!-- Left & Right Ears -->
    <path d="M54 44 C34 40 28 62 40 76 C48 84 56 76 60 70"/>
    <path d="M86 44 C106 40 112 62 100 76 C92 84 84 76 80 70"/>

    <!-- Head & Brow Curve -->
    <path d="M56 46 Q70 52 84 46"/>

    <!-- Sacred Trunk with Leftward Curve & Modak -->
    <path d="M68 62 C68 90 56 102 70 110 C80 114 90 106 86 94 C82 84 72 88 72 94"/>
    <circle cx="86" cy="94" r="4" fill="url(#goldRoyale)"/>

    <!-- Ivory Tusk -->
    <path d="M59 74 L52 78" stroke-width="3" stroke="#FFF7D6"/>

    <!-- Lotus Base -->
    <path d="M42 122 C56 128 84 128 98 122" stroke-width="2"/>
    <path d="M50 126 C62 131 78 131 90 126" stroke-width="1.2"/>
  </g>
</svg>
