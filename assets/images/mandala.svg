<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(250, 250)" stroke="url(#mGold)" fill="none" stroke-width="1.2" opacity="0.85">
    <!-- Center Core -->
    <circle r="12" fill="#D4AF37" opacity="0.4"/>
    <circle r="22" stroke-width="1.5"/>
    <circle r="30" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 8 Inner Petals -->
    <g id="petal8">
      <path d="M0 -22 C-8 -40, 8 -40, 0 -22" fill="#FFEFA6" fill-opacity="0.15"/>
      <path d="M0 -30 L0 -50" stroke-width="1"/>
      <circle cx="0" cy="-50" r="2.5" fill="#FFEFA6"/>
      <!-- Paisley accents -->
      <path d="M0 -35 C-12 -45, -8 -60, 0 -70 C8 -60, 12 -45, 0 -35"/>
    </g>
    <use href="#petal8" transform="rotate(45)"/>
    <use href="#petal8" transform="rotate(90)"/>
    <use href="#petal8" transform="rotate(135)"/>
    <use href="#petal8" transform="rotate(180)"/>
    <use href="#petal8" transform="rotate(225)"/>
    <use href="#petal8" transform="rotate(270)"/>
    <use href="#petal8" transform="rotate(315)"/>

    <!-- Middle Ring -->
    <circle r="72" stroke-width="1.8"/>
    <circle r="78" stroke-dasharray="4 2" stroke-width="1"/>
    <circle r="88" stroke-width="1.2"/>

    <!-- 16 Lotus Rays -->
    <g id="petal16">
      <path d="M0 -88 C-10 -105, -20 -125, 0 -140 C20 -125, 10 -105, 0 -88" fill="#D4AF37" fill-opacity="0.08"/>
      <path d="M0 -95 Q-8 -115 0 -132 Q8 -115 0 -95" stroke-width="0.8"/>
      <circle cx="0" cy="-140" r="3" fill="#FFEFA6"/>
      <path d="M-6 -110 Q0 -120 6 -110" stroke-width="0.8"/>
    </g>
    <use href="#petal16" transform="rotate(22.5)"/>
    <use href="#petal16" transform="rotate(45)"/>
    <use href="#petal16" transform="rotate(67.5)"/>
    <use href="#petal16" transform="rotate(90)"/>
    <use href="#petal16" transform="rotate(112.5)"/>
    <use href="#petal16" transform="rotate(135)"/>
    <use href="#petal16" transform="rotate(157.5)"/>
    <use href="#petal16" transform="rotate(180)"/>
    <use href="#petal16" transform="rotate(202.5)"/>
    <use href="#petal16" transform="rotate(225)"/>
    <use href="#petal16" transform="rotate(247.5)"/>
    <use href="#petal16" transform="rotate(270)"/>
    <use href="#petal16" transform="rotate(292.5)"/>
    <use href="#petal16" transform="rotate(315)"/>
    <use href="#petal16" transform="rotate(337.5)"/>
    <use href="#petal16" transform="rotate(0)"/>

    <!-- Outer Decorative Arch Band -->
    <circle r="148" stroke-width="2"/>
    <circle r="154" stroke-dasharray="2 4" stroke-width="1.5"/>
    <circle r="162" stroke-width="1"/>

    <!-- 24 Grand Outer Jharokha Cusps -->
    <g id="outerCusp">
      <path d="M-18 -162 C-15 -190, 0 -210, 0 -225 C0 -210, 15 -190, 18 -162" fill="#FFEFA6" fill-opacity="0.06"/>
      <path d="M0 -162 L0 -220" stroke-width="0.8"/>
      <circle cx="0" cy="-228" r="3.5" fill="#FFEFA6"/>
      <circle cx="-10" cy="-185" r="1.5" fill="#D4AF37"/>
      <circle cx="10" cy="-185" r="1.5" fill="#D4AF37"/>
    </g>
    <!-- Rotate around 360/16 = 22.5 or 360/24 = 15 -->
    <use href="#outerCusp" transform="rotate(0)"/>
    <use href="#outerCusp" transform="rotate(15)"/>
    <use href="#outerCusp" transform="rotate(30)"/>
    <use href="#outerCusp" transform="rotate(45)"/>
    <use href="#outerCusp" transform="rotate(60)"/>
    <use href="#outerCusp" transform="rotate(75)"/>
    <use href="#outerCusp" transform="rotate(90)"/>
    <use href="#outerCusp" transform="rotate(105)"/>
    <use href="#outerCusp" transform="rotate(120)"/>
    <use href="#outerCusp" transform="rotate(135)"/>
    <use href="#outerCusp" transform="rotate(150)"/>
    <use href="#outerCusp" transform="rotate(165)"/>
    <use href="#outerCusp" transform="rotate(180)"/>
    <use href="#outerCusp" transform="rotate(195)"/>
    <use href="#outerCusp" transform="rotate(210)"/>
    <use href="#outerCusp" transform="rotate(225)"/>
    <use href="#outerCusp" transform="rotate(240)"/>
    <use href="#outerCusp" transform="rotate(255)"/>
    <use href="#outerCusp" transform="rotate(270)"/>
    <use href="#outerCusp" transform="rotate(285)"/>
    <use href="#outerCusp" transform="rotate(300)"/>
    <use href="#outerCusp" transform="rotate(315)"/>
    <use href="#outerCusp" transform="rotate(330)"/>
    <use href="#outerCusp" transform="rotate(345)"/>

    <circle r="236" stroke-width="1.8" stroke-dasharray="8 4"/>
    <circle r="242" stroke-width="1"/>
  </g>
</svg>
